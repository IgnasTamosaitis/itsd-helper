name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build MSI
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseVersion = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $releaseVersion = (Get-Content -LiteralPath version.txt -Raw).Trim()
          }
          ./packaging/build_installer.ps1 -Version $releaseVersion

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Jira-Reminders-Windows-Installer
          path: dist/installer/*.msi
          if-no-files-found: error

      - name: Publish release with installer
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $releaseJson = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/installer/*.msi --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading the MSI failed." }

            $release = $releaseJson | ConvertFrom-Json
            if ($release.isDraft) {
              gh release edit $tag --draft=false
              if ($LASTEXITCODE -ne 0) { throw "Publishing the draft release failed." }
            }
          } else {
            gh release create $tag dist/installer/*.msi `
              --verify-tag `
              --generate-notes `
              --title $tag
            if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }
          }
